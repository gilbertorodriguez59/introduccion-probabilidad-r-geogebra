name: Publicar edición estable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio estable
        uses: actions/checkout@v4

      - name: Promover contenido aprobado desde desarrollo
        if: ${{ hashFiles('01-incertidumbre-probabilidad.qmd') == '' }}
        run: |
          git clone --depth 1 https://github.com/gilbertorodriguez59/introduccion-probabilidad-r-geogebra-dev.git /tmp/dev
          cp /tmp/dev/index.qmd .
          cp /tmp/dev/bienvenida.qmd .
          cp /tmp/dev/presentacion.qmd .
          cp /tmp/dev/introduccion.qmd .
          cp /tmp/dev/notacion.qmd .
          cp /tmp/dev/01-incertidumbre-probabilidad.qmd .
          cp /tmp/dev/02-espacios-eventos.qmd .
          cp /tmp/dev/03-conteo-probabilidad.qmd .
          cp /tmp/dev/references.bib .
          cp /tmp/dev/references.qmd .
          cp /tmp/dev/_quarto.yml .
          rm -rf interactivos html
          cp -r /tmp/dev/interactivos .
          cp -r /tmp/dev/html .
          sed -i 's#introduccion-probabilidad-r-geogebra-dev#introduccion-probabilidad-r-geogebra#g' _quarto.yml
          cat > README.md <<'EOF'
          # Introducción a la Probabilidad con R y GeoGebra

          Repositorio estable del libro **Introducción a la Probabilidad con R y GeoGebra: teoría, simulación y aplicaciones para ingeniería y ciencias**.

          Autor: Jesús Gilberto Rodríguez Escobedo.

          Esta edición contiene los capítulos revisados y aprobados provenientes del repositorio de desarrollo.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md _quarto.yml *.qmd references.bib interactivos html
          git commit -m "Promover capítulos revisados a edición estable [skip ci]"
          git push

      - name: Instalar Quarto y TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Instalar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          install-quarto: false

      - name: Verificar dependencias de R
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("knitr", quietly = TRUE))
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))

      - name: Renderizar HTML y PDF
        run: |
          quarto render
          touch docs/.nojekyll

      - name: Guardar sitio estable en main/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if git diff --cached --quiet; then
            echo "No hay cambios en docs."
          else
            git commit -m "Actualizar edición estable web y PDF [skip ci]"
            git push
          fi
